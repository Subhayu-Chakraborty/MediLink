version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AI-Based Medical Report Analyzer — Docker Compose
#
# Services:
#   backend  — FastAPI application (Python 3.10, port 8000)
#   frontend — Vite + React + TypeScript (Node 18, port 5173)
#
# Note: MongoDB is NOT included here. This project uses MongoDB Atlas (cloud).
#       Set MONGODB_URL in backend/.env to your Atlas connection string.
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs
#   docker compose down                # stop & remove containers
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: mra_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env           # Load secrets from the .env file (not committed)
    volumes:
      # Bind-mount the uploads directory so files persist across restarts.
      - ./backend/uploads:/app/uploads
      # Bind-mount the source code for hot-reloading in development.
      - ./backend:/app
    environment:
      # Override / supplement .env values here if needed.
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (Vite + React) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: mra_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Bind-mount source for hot-reloading; exclude node_modules.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  # No local MongoDB volume needed — using Atlas cloud.
  # Add S3-like volume mounts here in future if switching away from local storage.
